<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hurrier Followup Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #72777d;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }
        .header h2 { margin: 0; font-size: 24px; }
        .clock { font-size: 20px; font-weight: bold; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 15px;
        }
        .card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .order-id { font-size: 18px; font-weight: bold; color: #111; }
        .phone { font-size: 14px; color: #555; margin-top: 4px; }
        .col-box { text-align: center; }
        .label { font-size: 12px; color: #777; font-weight: bold; text-transform: uppercase; }
        .val { font-size: 16px; font-weight: bold; margin-top: 2px; }
        .awt-red { color: #d93025; font-weight: bold; }
        .no-orders {
            color: white;
            text-align: center;
            font-size: 20px;
            grid-column: 1 / -1;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="hub-title">READY FOR PICKUP</h2>
        <div class="clock" id="clock">--:--</div>
    </div>

    <div class="grid" id="orders-container">
        <div class="no-orders">جاري تحميل البيانات...</div>
    </div>

    <script>
        // قراءة الـ Hub المطلوب من الـ URL (مثال: ?hub=nasr-city)
        const urlParams = new URLSearchParams(window.location.search);
        const currentHub = urlParams.get('hub') || 'all';

        document.getElementById('hub-title').innerText = `READY FOR PICKUP (${currentHub.replace('-', ' ').toUpperCase()})`;

        // تحديث الساعة لحظياً
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // جلب الأوردرات من ملف data.json المحدث من البوت
        async function fetchOrders() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                const data = await res.json();
                
                const container = document.getElementById('orders-container');
                container.innerHTML = '';

                // فلترة الطلبات بناءً على الـ Hub المختار في الـ URL
                const filtered = data.filter(item => currentHub === 'all' || item.hub === currentHub);

                if (filtered.length === 0) {
                    container.innerHTML = '<div class="no-orders">لا توجد طلبات متأخرة حالياً لهذا الفرع 🚀</div>';
                    return;
                }

                filtered.forEach(order => {
                    const card = `
                        <div class="card">
                            <div>
                                <div class="order-id">${order.order_id}</div>
                                <div class="phone">${order.phone}</div>
                            </div>
                            <div class="col-box">
                                <div class="label">Window</div>
                                <div class="val">${order.window}</div>
                            </div>
                            <div class="col-box">
                                <div class="label">Time</div>
                                <div class="val">${order.time}</div>
                            </div>
                            <div class="col-box">
                                <div class="label">AWT</div>
                                <div class="val awt-red">${order.awt}</div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (err) {
                console.log('انتظار تحديث البيانات...');
            }
        }

        fetchOrders();
        setInterval(fetchOrders, 5000); // تحديث التلقائي كل 5 ثوانٍ
    </script>
</body>
</html>
