<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hurrier Active Deliveries</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; color: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #eee; }
        th { background-color: #2c3e50; color: white; font-size: 14px; }
        .badge-delay { background-color: #d93025; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; display: inline-block; }
        .vendor-name { font-size: 12px; color: #666; margin-top: 3px; }
        .courier-name { font-weight: bold; color: #0056b3; }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="hub-title">Hurrier - Active Deliveries</h2>
        <h3 id="clock">--:--</h3>
    </div>

    <table>
        <thead>
            <tr>
                <th>ORDER</th>
                <th>DEADLINE</th>
                <th>COURIER</th>
                <th>STATUS</th>
                <th>ZONE</th>
            </tr>
        </thead>
        <tbody id="orders-table">
            <tr><td colspan="5" style="text-align:center;">جاري جلب البيانات...</td></tr>
        </tbody>
    </table>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentHub = urlParams.get('hub') || 'all';

        function updateClock() {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchOrders() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                const data = await res.json();
                
                const tbody = document.getElementById('orders-table');
                tbody.innerHTML = '';

                const filtered = data.filter(item => currentHub === 'all' || item.hub === currentHub);

                if(filtered.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد طلبات حالية 🚀</td></tr>';
                    return;
                }

                filtered.forEach(order => {
                    tbody.innerHTML += `
                        <tr>
                            <td>
                                <b>${order.order_id || order.order || '-'}</b>
                                <div class="vendor-name">${order.vendor || ''}</div>
                            </td>
                            <td><span class="badge-delay">${order.delay || order.awt || '-'}</span></td>
                            <td class="courier-name">${order.courier || '-'}</td>
                            <td><b>${order.status || '-'}</b></td>
                            <td>${order.zone || '-'}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.log('جاري المزامنة...');
            }
        }

        fetchOrders();
        setInterval(fetchOrders, 5000);
    </script>
</body>
</html>
